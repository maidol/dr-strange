name: Feature request
description: Something it should be able to do and cannot
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: >
        The task, not the feature. A described task can often be answered by
        something that already exists, and when it cannot, it says what the
        feature has to be good at.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, however ugly. It is the best evidence of the cost.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What you think it should look like
      description: >
        A command, a verb, a query — a guess is useful even if it is wrong.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Engine (storage, cache, algorithms)
        - Query language (the openCypher subset)
        - CLI
        - MCP server / agent verbs
        - Web (serve, dashboard)
        - SDKs
        - Docs
        - A language plugin (note: these live in the extensions repository)
        - Not sure
    validations:
      required: true
