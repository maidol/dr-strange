name: Bug report
description: Something does not do what it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues do not belong here — see
        [SECURITY.md](https://github.com/wangyingsm/dr-strange/blob/master/SECURITY.md).

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: What you ran, verbatim, including flags.
      placeholder: drsg digest ~/src/myrepo --apply
      render: console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: >
        The part that matters most. "It failed" names a symptom; "`context Foo`
        should have listed `bar` as a caller, and `bar` calls it on line 12"
        names the bug.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output, or the error, as printed.
      render: console
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "`drsg --version`"
      placeholder: drsg 2.22.0
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true

  - type: textarea
    id: plane
    attributes:
      label: The plane, if a graph is involved
      description: >
        For anything where a plane looks wrong, `drsg catalog --plane <name>`
        says more than a description can — it prints the soft schema the plane
        actually holds. Which language plugin and version were parsing it also
        helps, since plugins ship from their own repository.
      render: console
    validations:
      required: false
