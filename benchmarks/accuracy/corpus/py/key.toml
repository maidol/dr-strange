# Ground truth for the Python fixture.
#
# Names are tool-neutral: a module-level function is `module.name`, a method
# is `module.Class.name`. Every tool's output is normalised into this
# vocabulary before scoring.
#
# Python settles less at parse time than Go. There are no declared types on
# most receivers, so what Go calls an interface call is here simply a call on
# an attribute of unknown type — the common case rather than the exception.

[corpus]
language = "py"
entry = "."
# No usable static oracle: pycg does not install under a current interpreter,
# and no type checker emits a call graph. Instead `crosscheck_py.py` runs the
# fixture under `sys.setprofile` and records the calls that actually happen.
# That is truth rather than approximation, bounded the other way: it sees only
# what the exercise covers, as Go's RTA sees only what `main` reaches.
crosscheck = "dynamic trace via sys.setprofile"

# ---------------------------------------------------------------------------
# WHERE EACH SYMBOL IS DECLARED.
#
# Identity for a cross-tool comparison, because tools do not agree on names.
# Matching on names would score the harness's name-mangling rather than any
# tool's accuracy, and would make a competitor look wrong for a naming
# convention. Symbols the fixture does not define — the standard library —
# have no line here and are matched by name.
#
# Extracted from the source and checked: the line each entry points at is the
# declaration that introduces the symbol, not a call to it.
# ---------------------------------------------------------------------------
[symbols]
"dynamic.direct" = "dynamic.py:35"
"dynamic.fetch" = "dynamic.py:19"
"dynamic.retry.wrapper" = "dynamic.py:12"
"dynamic.via_getattr" = "dynamic.py:24"
"dynamic.via_local_alias" = "dynamic.py:29"
"service.Cache.get" = "service.py:12"
"service.Service._inner" = "service.py:36"
"service.Service.helper" = "service.py:32"
"service.Service.load" = "service.py:20"
"service.Service.save" = "service.py:25"
"service.Service.warm" = "service.py:28"
"store.AuditStore._note" = "store.py:49"
"store.AuditStore.get" = "store.py:41"
"store.AuditStore.put" = "store.py:45"
"store.MemStore.get" = "store.py:27"
"store.MemStore.put" = "store.py:30"
"store.encode" = "store.py:53"

# ---------------------------------------------------------------------------
# RESOLVED — unambiguous from syntax alone.
# ---------------------------------------------------------------------------
[[resolved]]
from = "service.Service.save"
to = "store.encode"
why = "an imported module-level function, called by name"

[[resolved]]
from = "service.Service.warm"
to = "service.Cache.get"
why = "the parameter is annotated `Cache`, so the target is written down"

[[resolved]]
from = "service.Service.helper"
to = "service.Service._inner"
why = "a call on `self`, whose class is the enclosing one"

[[resolved]]
from = "store.AuditStore.get"
to = "store.AuditStore._note"
why = "a call on `self`"

[[resolved]]
from = "store.AuditStore.put"
to = "store.AuditStore._note"
why = "a call on `self`"

[[resolved]]
from = "store.encode"
to = "json.dumps"
why = "an imported function from the standard library"

[[resolved]]
from = "dynamic.direct"
to = "store.encode"
why = "the plain case, for contrast with the three below it"

[[resolved]]
from = "dynamic.fetch"
to = "store.encode"
why = "the decorated function's own body still calls encode by name"

# ---------------------------------------------------------------------------
# AMBIGUOUS — no annotation, a name bound at runtime, or a decorator between
# the caller and the callee. Saying so is the right answer.
# ---------------------------------------------------------------------------
[[ambiguous]]
from = "service.Service.load"
site = "self.store.get(key)"
candidates = ["store.MemStore.get", "store.AuditStore.get", "service.Cache.get"]
why = "`store` is whatever was passed to __init__; nothing declares its type"

[[ambiguous]]
from = "service.Service.save"
site = "self.store.put(...)"
candidates = ["store.MemStore.put", "store.AuditStore.put"]
why = "same, through put"

[[ambiguous]]
from = "store.AuditStore.get"
site = "self.inner.get(key)"
candidates = ["store.MemStore.get", "store.AuditStore.get"]
why = "a decorator holding an undeclared inner"

[[ambiguous]]
from = "store.AuditStore.put"
site = "self.inner.put(...)"
candidates = ["store.MemStore.put", "store.AuditStore.put"]
why = "same, through put"

[[ambiguous]]
from = "dynamic.via_getattr"
site = "getattr(obj, name)()"
candidates = []
why = "the method name is a string value; nothing static can name the target"

[[ambiguous]]
from = "dynamic.via_local_alias"
site = "f({'a': 1})"
candidates = ["store.encode"]
why = "the function is bound to a local first"

[[ambiguous]]
from = "dynamic.retry.wrapper"
site = "fn(*args, **kwargs)"
candidates = ["dynamic.fetch"]
why = "a decorator's wrapper calls whatever it wrapped; the binding is a runtime fact"

# Where each type is declared. Separate from `[symbols]` because these are
# what a reference points at, not something that calls or is called: putting
# them in the call universe would turn a constructor edge into a false call.
[types]
"store.AuditStore" = "store.py:34"
"service.Cache" = "service.py:6"
"store.MemStore" = "store.py:23"
"service.Service" = "service.py:16"
"store.Store" = "store.py:15"

# ---------------------------------------------------------------------------
# REFERENCE — cross-file type references: a symbol in one file naming a type
# declared in another. Enumerated from the source, not from any tool's output.
# Same-file references are deliberately absent: the task is the cross-file
# one, because that is the reference an agent cannot see in the file it has
# open. Static helper classes (`Text`, `TextExtensions`) are not in `[types]`,
# so a static call is not counted twice as a reference.
# ---------------------------------------------------------------------------
# None. The Python fixture has no cross-file type reference to find: its
# `Service.__init__(self, store)` carries no annotation, which is the point
# of that fixture — the receiver's type is never written down. An empty arm
# here is a fact about the code, not a tool failing to see something.

# ---------------------------------------------------------------------------
# IMPACT — "what would a change to this reach?", the question an agent asks
# before it edits anything. Scored as a set, over the calls a parser can
# resolve: every symbol below reaches the subject through `resolved` edges
# only, so no tool is asked to guess through an interface.
#
# This is where an edge error stops being a line in a report. One missing call
# hides a whole subtree of callers; one false call drags in code that was
# never involved. The set is the consequence an agent actually experiences.
# ---------------------------------------------------------------------------
[[impact]]
of = "store.encode"
reaches = ["dynamic.direct", "dynamic.fetch", "service.Service.save"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "store.AuditStore._note"
reaches = ["store.AuditStore.get", "store.AuditStore.put"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "service.Cache.get"
reaches = ["service.Service.warm"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "service.Service._inner"
reaches = ["service.Service.helper"]
why = "every symbol that reaches it through calls a parser can resolve"

# ---------------------------------------------------------------------------
# ABSENT — must never be asserted.
# ---------------------------------------------------------------------------
[[absent]]
from = "service.Service.warm"
to = "store.MemStore.get"
why = "warm is annotated Cache; MemStore merely has a method of the same name"

[[absent]]
from = "service.Service.warm"
to = "store.AuditStore.get"
why = "same trap, the other implementation"

[[absent]]
from = "service.Service.load"
to = "service.Cache.get"
why = "Cache is not a store; a tool matching on the bare name `get` reaches it"

[[absent]]
from = "dynamic.direct"
to = "dynamic.fetch"
why = "neither calls the other; both call encode"

[[absent]]
from = "store.encode"
to = "store.MemStore.put"
why = "encode touches no store at all"
