# Ground truth for the Rust fixture.
#
# Names are tool-neutral: `module::free_function`, `module::Type::method`.
#
# Rust writes types down more than Go or Python, so the ambiguity moves rather
# than disappears: a `dyn Trait` call is settled at runtime, a generic's target
# only after monomorphisation, and a macro can produce a call that appears in
# no line of source a parser reads.

[corpus]
language = "rust"
entry = "."
module = "orders"
# No call-graph oracle exists for Rust the way `callgraph` does for Go:
# rust-analyzer emits none, and a MIR-level analysis is a larger undertaking
# than the fixture it would check. `crosscheck_rust.py` therefore checks the
# one claim that can be checked mechanically — what the macro expands to —
# with `cargo expand`, and says plainly that the rest rests on the key.
crosscheck = "cargo expand, for the macro case only"

# ---------------------------------------------------------------------------
# WHERE EACH SYMBOL IS DECLARED.
#
# Identity for a cross-tool comparison, because tools do not agree on names.
# Matching on names would score the harness's name-mangling rather than any
# tool's accuracy, and would make a competitor look wrong for a naming
# convention. Symbols the fixture does not define — the standard library —
# have no line here and are matched by name.
#
# Extracted from the source and checked: the line each entry points at is the
# declaration that introduces the symbol, not a call to it.
# ---------------------------------------------------------------------------
[symbols]
"dispatch::via_closure" = "src/dispatch.rs:4"
"dispatch::via_fn_pointer" = "src/dispatch.rs:10"
"dispatch::via_generic" = "src/dispatch.rs:16"
"dispatch::via_macro" = "src/dispatch.rs:27"
"service::Cache::get" = "src/service.rs:10"
"service::Service::describe" = "src/service.rs:41"
"service::Service::label" = "src/service.rs:45"
"service::Service::load" = "src/service.rs:26"
"service::Service::save" = "src/service.rs:31"
"service::Service::warm" = "src/service.rs:36"
"store::AuditStore::get" = "src/store.rs:40"
"store::AuditStore::note" = "src/store.rs:34"
"store::AuditStore::put" = "src/store.rs:46"
"store::MemStore::get" = "src/store.rs:14"
"store::MemStore::put" = "src/store.rs:18"
"store::Store::get" = "src/store.rs:3"
"store::Store::put" = "src/store.rs:4"
"store::normalize" = "src/store.rs:53"

# ---------------------------------------------------------------------------
# RESOLVED — unambiguous from syntax alone.
# ---------------------------------------------------------------------------
[[resolved]]
from = "service::Service::save"
to = "store::normalize"
why = "a free function, imported and called by name"

[[resolved]]
from = "service::Service::warm"
to = "service::Cache::get"
why = "the parameter is typed `&Cache`, so the target is written down"

[[resolved]]
from = "service::Service::describe"
to = "service::Service::label"
why = "a call on `self` within the same impl"

[[resolved]]
from = "store::AuditStore::put"
to = "store::AuditStore::note"
why = "a call on `self` within the same impl"

[[resolved]]
from = "dispatch::via_closure"
to = "store::normalize"
why = "called inside a closure literal, which is this function's own text"

[[resolved]]
from = "dispatch::via_macro"
to = "store::normalize"
why = "the macro expands to a call to normalize; `cargo expand` confirms it"

# ---------------------------------------------------------------------------
# AMBIGUOUS — settled at runtime or at monomorphisation, not by syntax.
# ---------------------------------------------------------------------------
[[ambiguous]]
from = "service::Service::load"
site = "self.store.get(key)"
interface_method = "store::Store::get"
candidates = ["store::MemStore::get", "store::AuditStore::get"]
why = "a `Box<dyn Store>`; which implementation runs is a runtime fact"

[[ambiguous]]
from = "service::Service::save"
site = "self.store.put(...)"
interface_method = "store::Store::put"
candidates = ["store::MemStore::put", "store::AuditStore::put"]
why = "same, through put"

[[ambiguous]]
from = "store::AuditStore::get"
site = "self.inner.get(key)"
interface_method = "store::Store::get"
candidates = ["store::MemStore::get", "store::AuditStore::get"]
why = "a call on the generic parameter S; the target depends on the instantiation"

[[ambiguous]]
from = "store::AuditStore::put"
site = "self.inner.put(...)"
interface_method = "store::Store::put"
candidates = ["store::MemStore::put", "store::AuditStore::put"]
why = "same, through put"

[[ambiguous]]
from = "dispatch::via_fn_pointer"
site = "f(value)"
candidates = ["store::normalize"]
why = "a function pointer held in a local; the name appears as a value, not at the call"

[[ambiguous]]
from = "dispatch::via_generic"
site = "value.to_string()"
interface_method = "ToString::to_string"
candidates = []
why = """a trait method on a generic bounded by ToString; every implementor is a candidate. Naming the trait method is the honest resolution — it says what was called without pretending to know which implementation runs — so the key counts that as declaring the gap rather than guessing."""

# Where each type is declared. Separate from `[symbols]` because these are
# what a reference points at, not something that calls or is called: putting
# them in the call universe would turn a constructor edge into a false call.
[types]
"store::AuditStore" = "src/store.rs:24"
"service::Cache" = "src/service.rs:5"
"store::MemStore" = "src/store.rs:9"
"service::Service" = "src/service.rs:16"
"store::Store" = "src/store.rs:2"

# ---------------------------------------------------------------------------
# REFERENCE — cross-file type references: a symbol in one file naming a type
# declared in another. Enumerated from the source, not from any tool's output.
# Same-file references are deliberately absent: the task is the cross-file
# one, because that is the reference an agent cannot see in the file it has
# open. Static helper classes (`Text`, `TextExtensions`) are not in `[types]`,
# so a static call is not counted twice as a reference.
# ---------------------------------------------------------------------------
[[reference]]
from = "service::Service"
to = "store::Store"
why = "the `Box<dyn Store>` field, from store.rs"

# ---------------------------------------------------------------------------
# IMPACT — "what would a change to this reach?", the question an agent asks
# before it edits anything. Scored as a set, over the calls a parser can
# resolve: every symbol below reaches the subject through `resolved` edges
# only, so no tool is asked to guess through an interface.
#
# This is where an edge error stops being a line in a report. One missing call
# hides a whole subtree of callers; one false call drags in code that was
# never involved. The set is the consequence an agent actually experiences.
# ---------------------------------------------------------------------------
[[impact]]
of = "store::normalize"
reaches = ["dispatch::via_closure", "dispatch::via_macro", "service::Service::save"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "service::Cache::get"
reaches = ["service::Service::warm"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "service::Service::label"
reaches = ["service::Service::describe"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "store::AuditStore::note"
reaches = ["store::AuditStore::put"]
why = "every symbol that reaches it through calls a parser can resolve"

# ---------------------------------------------------------------------------
# ABSENT — must never be asserted.
# ---------------------------------------------------------------------------
[[absent]]
from = "service::Service::warm"
to = "store::Store::get"
why = "warm takes a &Cache; Store::get merely shares the name"

[[absent]]
from = "service::Service::warm"
to = "store::MemStore::get"
why = "same trap, one implementation further"

[[absent]]
from = "service::Service::load"
to = "service::Cache::get"
why = "Cache does not implement Store"

[[absent]]
from = "store::normalize"
to = "service::Service::label"
why = "both return String and neither calls the other"

[[absent]]
from = "dispatch::via_generic"
to = "store::normalize"
why = "via_generic calls ToString::to_string, not normalize"
