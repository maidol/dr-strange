# Ground truth for the C# fixture.
#
# Names are source-level: `Acme.Type.Method`.

[corpus]
language = "csharp"
entry = "src"
# UNVERIFIED. There is no C# compiler on the machine this was written on —
# no dotnet SDK, and mono's `mcs` needs a package install this account cannot
# perform — so unlike the other five keys, nothing independent has confirmed
# this one, and the fixture has never been compiled.
#
# What would verify it, in the same shape as the Java and Kotlin checks:
# compile with `dotnet build`, then read the IL with `ildasm` or `monodis` and
# match each `call`/`callvirt` against the entries below. Until that is run,
# read any score for C# as provisional — a syntax error or a wrong assumption
# here would not have been caught.
crosscheck = "none — see above"
unverified = true

# ---------------------------------------------------------------------------
# WHERE EACH SYMBOL IS DECLARED.
#
# Identity for a cross-tool comparison, because tools do not agree on names.
# Matching on names would score the harness's name-mangling rather than any
# tool's accuracy, and would make a competitor look wrong for a naming
# convention. Symbols the fixture does not define — the standard library —
# have no line here and are matched by name.
#
# Extracted from the source and checked: the line each entry points at is the
# declaration that introduces the symbol, not a call to it.
# ---------------------------------------------------------------------------
