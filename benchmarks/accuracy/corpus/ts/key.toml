# ---------------------------------------------------------------------------
# AMBIGUOUS — the annotation gives a shape, not an implementation.
# ---------------------------------------------------------------------------
[[ambiguous]]
from = "service.Service.load"
site = "this.store.get(key)"
interface_method = "store.Store.get"
candidates = ["store.MemStore.get", "store.AuditStore.get"]
why = "the field is typed `Store`; which class was constructed is a runtime fact"

[[ambiguous]]
from = "service.Service.save"
site = "this.store.put(...)"
interface_method = "store.Store.put"
candidates = ["store.MemStore.put", "store.AuditStore.put"]
why = "same, through put"

[[ambiguous]]
from = "store.AuditStore.get"
site = "this.inner.get(key)"
interface_method = "store.Store.get"
candidates = ["store.MemStore.get", "store.AuditStore.get"]
why = "a decorator holding the interface it decorates"

[[ambiguous]]
from = "store.AuditStore.put"
site = "this.inner.put(...)"
interface_method = "store.Store.put"
candidates = ["store.MemStore.put", "store.AuditStore.put"]
why = "same, through put"

[[ambiguous]]
from = "dynamic.viaFnValue"
site = "f(value)"
candidates = ["store.normalize"]
why = "the function is bound to a local first"

[[ambiguous]]
from = "dynamic.viaIndex"
site = "obj[name]()"
candidates = []
why = "the method name is a string value; nothing static can name the target"

[[ambiguous]]
from = "dynamic.viaOptional"
site = "s?.get()"
candidates = []
why = "an optional call on a structural type with no named implementation"

# ---------------------------------------------------------------------------
# ABSENT — must never be asserted.
# ---------------------------------------------------------------------------
[[absent]]
from = "service.Service.warm"
to = "store.Store.get"
why = "warm takes a Cache; Store.get merely shares the name"

[[absent]]
from = "service.Service.warm"
to = "store.MemStore.get"
why = "same trap, one implementation further"

[[absent]]
from = "service.Service.load"
to = "service.Cache.get"
why = "Cache does not implement Store"

[[absent]]
from = "dynamic.direct"
to = "dynamic.viaArrow"
why = "neither calls the other; both call normalize"

[[absent]]
from = "store.normalize"
to = "store.MemStore.put"
why = "normalize touches no store at all"
