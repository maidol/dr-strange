# Ground truth for the TypeScript fixture.
#
# Names are tool-neutral: `module.function`, `module.Class.method`, where the
# module is the file stem.

[corpus]
language = "ts"
entry = "."
# drsg prefixes a TypeScript key with the directory it was digested from.
module = "ts"
# TypeScript has a real oracle: the compiler's own checker resolves a call
# expression to the declaration it binds to. `crosscheck_ts.py` drives it
# through the TypeScript API and compares. Its bound is the mirror of Go's
# RTA: the checker answers for the *declared* type, so an interface call
# resolves to the interface's method and never to an implementation.
crosscheck = "the TypeScript compiler's type checker"

