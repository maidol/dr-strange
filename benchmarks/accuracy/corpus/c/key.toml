# Ground truth for the C fixture.
#
# C has one namespace for external functions, so a name is just the function's
# name. Statics are local to their file but still named plainly here.

[corpus]
language = "c"
entry = "."
# drsg keys a C function by the file it was parsed from; the key names it the
# way the source does, since C has one namespace for externals.
strip = "^[\\w.]+\\.[ch]::"
# The oracle is the object code. `objdump -d -r` shows every call, and the two
# kinds are distinguishable without ambiguity:
#   * a direct call carries a symbol — `call <cache_get>` for one in the same
#     object, or a `R_X86_64_PLT32 normalize` relocation for one outside it;
#   * an indirect call is `call *%rcx` and names nothing, which is exactly the
#     shape of a call through a struct of function pointers.
# Caveat: the compiler rewrites some calls (`printf("%s\n", x)` becomes
# `puts`), so the key names no libc function.
crosscheck = "objdump -d -r on the compiled objects"

# ---------------------------------------------------------------------------
# WHERE EACH SYMBOL IS DECLARED.
#
# Identity for a cross-tool comparison, because tools do not agree on names.
# Matching on names would score the harness's name-mangling rather than any
# tool's accuracy, and would make a competitor look wrong for a naming
# convention. Symbols the fixture does not define — the standard library —
# have no line here and are matched by name.
#
# Extracted from the source and checked: the line each entry points at is the
# declaration that introduces the symbol, not a call to it.
# ---------------------------------------------------------------------------
[symbols]
"audit_get" = "store.c:29"
"audit_put" = "store.c:36"
"cache_get" = "service.c:10"
"direct" = "dispatch.c:17"
"mem_get" = "store.c:8"
"mem_put" = "store.c:13"
"normalize" = "store.c:43"
"note" = "store.c:19"
"service_describe" = "service.c:40"
"service_label" = "service.c:35"
"service_load" = "service.c:20"
"service_save" = "service.c:25"
"service_warm" = "service.c:30"
"via_fn_pointer" = "dispatch.c:4"
"via_macro" = "dispatch.c:12"

# ---------------------------------------------------------------------------
# RESOLVED — the target is named at the call site.
# ---------------------------------------------------------------------------
[[resolved]]
from = "service_save"
to = "normalize"
why = "a plain function, called by name"

[[resolved]]
from = "service_warm"
to = "cache_get"
why = "a static in the same file, called by name"

[[resolved]]
from = "service_describe"
to = "service_label"
why = "a function in the same file, called by name"

[[resolved]]
from = "audit_get"
to = "note"
why = "a static in the same file"

[[resolved]]
from = "audit_put"
to = "note"
why = "a static in the same file"

[[resolved]]
from = "direct"
to = "normalize"
why = "the plain case, for contrast with the two below it"

[[resolved]]
from = "via_macro"
to = "normalize"
why = """the macro expands to a call to normalize. The call appears in no line \
of source a parser reads, which is what makes it worth asking about."""

# ---------------------------------------------------------------------------
# AMBIGUOUS — a call through a function pointer. The object code says
# `call *%reg` and names nothing, because there is nothing to name.
# ---------------------------------------------------------------------------
[[ambiguous]]
from = "service_load"
site = "s->store->get(s->store, key)"
candidates = ["mem_get", "audit_get"]
why = "through the Store vtable; which function was assigned is a runtime fact"

[[ambiguous]]
from = "service_save"
site = "s->store->put(...)"
candidates = ["mem_put", "audit_put"]
why = "same, through put"

[[ambiguous]]
from = "audit_get"
site = "a->inner->get(a->inner, key)"
candidates = ["mem_get", "audit_get"]
why = "a decorator holding another Store"

[[ambiguous]]
from = "audit_put"
site = "a->inner->put(...)"
candidates = ["mem_put", "audit_put"]
why = "same, through put"

[[ambiguous]]
from = "via_fn_pointer"
site = "f(value)"
candidates = ["normalize"]
why = "a function pointer held in a local; the name appears as a value"

# Where each type is declared. Separate from `[symbols]` because these are
# what a reference points at, not something that calls or is called: putting
# them in the call universe would turn a constructor edge into a false call.
[types]
"AuditStore" = "store.c:27"
"Cache" = "service.c:8"
"Service" = "service.c:17"
"Store" = "store.h:13"

# ---------------------------------------------------------------------------
# REFERENCE — cross-file type references: a symbol in one file naming a type
# declared in another. Enumerated from the source, not from any tool's output.
# Same-file references are deliberately absent: the task is the cross-file
# one, because that is the reference an agent cannot see in the file it has
# open. Static helper classes (`Text`, `TextExtensions`) are not in `[types]`,
# so a static call is not counted twice as a reference.
# ---------------------------------------------------------------------------
[[reference]]
from = "mem_get"
to = "Store"
why = "the `Store *self` parameter, from store.h"

[[reference]]
from = "mem_put"
to = "Store"
why = "the `Store *self` parameter, from store.h"

[[reference]]
from = "audit_get"
to = "Store"
why = "the `Store *self` parameter, from store.h"

[[reference]]
from = "audit_put"
to = "Store"
why = "the `Store *self` parameter, from store.h"

[[reference]]
from = "AuditStore"
to = "Store"
why = "the embedded `Store base` and `Store *inner`, from store.h"

[[reference]]
from = "Service"
to = "Store"
why = "the `Store *store` field, from store.h"

# ---------------------------------------------------------------------------
# IMPACT — "what would a change to this reach?", the question an agent asks
# before it edits anything. Scored as a set, over the calls a parser can
# resolve: every symbol below reaches the subject through `resolved` edges
# only, so no tool is asked to guess through an interface.
#
# This is where an edge error stops being a line in a report. One missing call
# hides a whole subtree of callers; one false call drags in code that was
# never involved. The set is the consequence an agent actually experiences.
# ---------------------------------------------------------------------------
[[impact]]
of = "normalize"
reaches = ["direct", "service_save", "via_macro"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "note"
reaches = ["audit_get", "audit_put"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "cache_get"
reaches = ["service_warm"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "service_label"
reaches = ["service_describe"]
why = "every symbol that reaches it through calls a parser can resolve"

# ---------------------------------------------------------------------------
# ABSENT — must never be asserted.
# ---------------------------------------------------------------------------
[[absent]]
from = "service_warm"
to = "mem_get"
why = "warm calls the file's own cache_get; mem_get is a different `get` entirely"

[[absent]]
from = "service_warm"
to = "audit_get"
why = "same trap, the other implementation"

[[absent]]
from = "service_load"
to = "cache_get"
why = "load goes through the Store vtable, which cache_get is not part of"

[[absent]]
from = "normalize"
to = "mem_put"
why = "normalize touches no store at all"

[[absent]]
from = "direct"
to = "via_macro"
why = "neither calls the other; both reach normalize"
