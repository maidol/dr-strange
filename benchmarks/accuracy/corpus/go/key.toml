# Ground truth for the Go fixture.
#
# Names are tool-neutral: a package-level function is its bare name, a method
# is `Type.Method`, and anything outside this module keeps its import path.
# Every tool's output is normalised into this vocabulary before scoring, so
# the key favours no one's internal naming.
#
# The three buckets below are not three ways of saying the same thing. They
# ask different questions of a parser, and a tool can do well at one and
# badly at another.

[corpus]
language = "go"
entry = "."
module = "acme/orders"
# Checked against `callgraph` (golang.org/x/tools) — see crosscheck_go.py.
# RTA and CHA both over-approximate, in opposite directions, so neither is
# used as the key itself; they are used to catch an edge in `resolved` that
# does not exist, and an edge in `absent` that does.
crosscheck = "callgraph -algo=rta and -algo=cha"

# ---------------------------------------------------------------------------
# WHERE EACH SYMBOL IS DECLARED.
#
# Identity for a cross-tool comparison, because tools do not agree on names.
# codegraph calls the interface method `Get` and distinguishes it from the
# other two `Get`s by printing `store.go:13`; codebase-memory-mcp qualifies an
# interface method but leaves a struct's method bare. Matching on names would
# score the harness's name-mangling rather than any tool's accuracy, and would
# make a competitor look wrong for a naming convention.
#
# These lines are read from the source and agree with what both tools report.
# ---------------------------------------------------------------------------
[symbols]
"upper" = "dispatch.go:8"
"viaFuncValue" = "dispatch.go:11"
"viaMethodValue" = "dispatch.go:17"
"viaClosure" = "dispatch.go:23"
"viaDefer" = "dispatch.go:29"
"viaGo" = "dispatch.go:33"
"main" = "main.go:5"
"Service.Load" = "service.go:9"
"Service.Save" = "service.go:12"
"normalize" = "service.go:21"
"Cache.Get" = "service.go:30"
"Service.Warm" = "service.go:34"
"Store.Get" = "store.go:13"
"Store.Put" = "store.go:14"
"MemStore.Get" = "store.go:20"
"MemStore.Put" = "store.go:27"
"AuditStore.Get" = "store.go:39"
"AuditStore.Put" = "store.go:44"
"AuditStore.note" = "store.go:49"

# ---------------------------------------------------------------------------
# RESOLVED — the target is unambiguous from syntax alone. A parser that misses
# one of these is incomplete. Scored as recall.
# ---------------------------------------------------------------------------
[[resolved]]
from = "Service.Save"
to = "normalize"
why = "a package-level function called by name"

[[resolved]]
from = "normalize"
to = "strings.TrimSpace"
why = "an imported function, named at the call site"

[[resolved]]
from = "Service.Warm"
to = "Cache.Get"
why = "method on a parameter whose type is written in the signature"

[[resolved]]
from = "AuditStore.Get"
to = "AuditStore.note"
why = "a method on the receiver's own type"

[[resolved]]
from = "AuditStore.Put"
to = "AuditStore.note"
why = "a method on the receiver's own type"

[[resolved]]
from = "MemStore.Get"
to = "fmt.Errorf"
why = "an imported function inside a conditional"

[[resolved]]
from = "viaDefer"
to = "Cache.Get"
why = "a deferred call is still a call"

[[resolved]]
from = "viaGo"
to = "Cache.Get"
why = "a goroutine call is still a call"

[[resolved]]
from = "viaClosure"
to = "upper"
why = "called inside a closure literal, which is still this function's text"

[[resolved]]
from = "main"
to = "Service.Load"
why = "method on a local whose type is the composite literal beside it"

[[resolved]]
from = "main"
to = "Service.Save"
why = "method on a local whose type is the composite literal beside it"

[[resolved]]
from = "main"
to = "viaFuncValue"
why = "a package-level function called by name"

[[resolved]]
from = "main"
to = "viaClosure"
why = "a package-level function called by name"

[[resolved]]
from = "main"
to = "fmt.Println"
why = "an imported function"

# ---------------------------------------------------------------------------
# AMBIGUOUS — the target depends on a value's dynamic type, which no parser
# reading syntax can know. The right answer is to say so: record the call as
# unresolved, or point at the interface method, but never assert one concrete
# implementation. Scored as honesty, not as recall.
# ---------------------------------------------------------------------------
[[ambiguous]]
from = "Service.Load"
site = "s.store.Get(id)"
interface_method = "Store.Get"
candidates = ["MemStore.Get", "AuditStore.Get"]
why = "the field's type is the interface Store; which implementation is injected is a runtime fact"

[[ambiguous]]
from = "Service.Save"
site = "s.store.Put(...)"
interface_method = "Store.Put"
candidates = ["MemStore.Put", "AuditStore.Put"]
why = "same, through Put"

[[ambiguous]]
from = "AuditStore.Get"
site = "a.inner.Get(id)"
interface_method = "Store.Get"
candidates = ["MemStore.Get", "AuditStore.Get"]
why = "a decorator holding the interface it decorates; RTA reports the self-edge too"

[[ambiguous]]
from = "AuditStore.Put"
site = "a.inner.Put(...)"
interface_method = "Store.Put"
candidates = ["MemStore.Put", "AuditStore.Put"]
why = "same, through Put"

[[ambiguous]]
from = "viaFuncValue"
site = "h(s)"
candidates = ["upper"]
why = "a variable of a function type; CHA answers with every function of that signature in the universe, which is the measure of how little syntax settles here"

[[ambiguous]]
from = "viaMethodValue"
site = "get(key)"
candidates = ["Cache.Get"]
why = "a bound method value assigned to a local"

# ---------------------------------------------------------------------------
# IMPACT — "what would a change to this reach?", the question an agent asks
# before it edits anything. Scored as a set, over the calls a parser can
# resolve: every symbol below reaches the subject through `resolved` edges
# only, so a tool is not asked to guess through an interface.
#
# This is where an edge error stops being a line in a report. One missing call
# hides a whole subtree of callers; one false call drags in code that was
# never involved. The set is the consequence an agent actually experiences.
# ---------------------------------------------------------------------------
[[impact]]
of = "normalize"
reaches = ["Service.Save", "main"]
why = "Save calls it directly; main reaches it through Save"

[[impact]]
of = "AuditStore.note"
reaches = ["AuditStore.Get", "AuditStore.Put"]
why = """both decorator methods call it. Nothing further: what calls *them* goes through the Store interface, which no parser can settle."""

[[impact]]
of = "Cache.Get"
reaches = ["Service.Warm", "viaDefer", "viaGo"]
why = "the annotated receiver, plus the deferred and goroutine call sites"

[[impact]]
of = "upper"
reaches = ["main", "viaClosure"]
why = """viaClosure calls it inside a closure literal, and main calls viaClosure. viaFuncValue is absent on purpose: it reaches upper only through a function value, which the key marks ambiguous."""

# ---------------------------------------------------------------------------
# ABSENT — pairs that must never be asserted. A tool that matches on a bare
# method name will produce these. Scored as precision.
# ---------------------------------------------------------------------------
[[absent]]
from = "Service.Warm"
to = "Store.Get"
why = "Warm calls Cache.Get; Store.Get merely shares the name"

[[absent]]
from = "Service.Warm"
to = "MemStore.Get"
why = "same trap, one implementation further"

[[absent]]
from = "Service.Load"
to = "Cache.Get"
why = "Load goes through Store, which Cache does not implement"

[[absent]]
from = "normalize"
to = "upper"
why = "both take and return a string and neither calls the other"

[[absent]]
from = "viaDefer"
to = "Store.Get"
why = "the deferred call is on *Cache"
