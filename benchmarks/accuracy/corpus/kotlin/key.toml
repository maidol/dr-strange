# Ground truth for the Kotlin fixture.
#
# Names are source-level: `acme.topLevelFunction`, `acme.Type.method`. Kotlin
# puts a file's top-level declarations in a synthetic `<File>Kt` class on the
# JVM, so the oracle maps `acme/StoreKt.normalize` back to `acme.normalize` —
# the name the source actually writes.

[corpus]
language = "kotlin"
entry = "src"
# The oracle is the compiled bytecode, as for Java: `javap -c` names the
# target of every invoke. Kotlin adds three wrinkles the check accounts for:
#   * top-level functions live in a `<File>Kt` class;
#   * every function starts with `Intrinsics.checkNotNullParameter`, which is
#     the compiler's null check and not a call the source made;
#   * a lambda is reached by `invokedynamic`, so its body's calls belong to a
#     synthetic method and are attributed to the function that declares it.
crosscheck = "javap -c, the compiled bytecode"

# ---------------------------------------------------------------------------
# WHERE EACH SYMBOL IS DECLARED.
#
# Identity for a cross-tool comparison, because tools do not agree on names.
# Matching on names would score the harness's name-mangling rather than any
# tool's accuracy, and would make a competitor look wrong for a naming
# convention. Symbols the fixture does not define — the standard library —
# have no line here and are matched by name.
#
# Extracted from the source and checked: the line each entry points at is the
# declaration that introduces the symbol, not a call to it.
# ---------------------------------------------------------------------------
[symbols]
"acme.AuditStore.get" = "src/Store.kt:24"
"acme.AuditStore.note" = "src/Store.kt:34"
"acme.AuditStore.put" = "src/Store.kt:29"
"acme.Cache.get" = "src/Service.kt:7"
"acme.Dispatch.direct" = "src/Dispatch.kt:24"
"acme.Dispatch.shout" = "src/Dispatch.kt:19"
"acme.Dispatch.viaExtension" = "src/Dispatch.kt:21"
"acme.Dispatch.viaFunctionRef" = "src/Dispatch.kt:13"
"acme.Dispatch.viaLambda" = "src/Dispatch.kt:7"
"acme.MemStore.get" = "src/Store.kt:13"
"acme.MemStore.put" = "src/Store.kt:15"
"acme.Service.describe" = "src/Service.kt:25"
"acme.Service.label" = "src/Service.kt:27"
"acme.Service.load" = "src/Service.kt:14"
"acme.Service.save" = "src/Service.kt:17"
"acme.Service.warm" = "src/Service.kt:22"
"acme.Store.get" = "src/Store.kt:5"
"acme.Store.put" = "src/Store.kt:6"
"acme.normalize" = "src/Store.kt:40"

# ---------------------------------------------------------------------------
# RESOLVED — unambiguous from syntax alone.
# ---------------------------------------------------------------------------
[[resolved]]
from = "acme.Service.save"
to = "acme.normalize"
why = "a top-level function, called by name"

[[resolved]]
from = "acme.Service.warm"
to = "acme.Cache.get"
why = "the parameter is typed Cache, so the target is written down"

[[resolved]]
from = "acme.Service.describe"
to = "acme.Service.label"
why = "a call on this, within the same class"

[[resolved]]
from = "acme.AuditStore.get"
to = "acme.AuditStore.note"
why = "a private method on the same class"

[[resolved]]
from = "acme.AuditStore.put"
to = "acme.AuditStore.note"
why = "a private method on the same class"

[[resolved]]
from = "acme.Dispatch.direct"
to = "acme.normalize"
why = "the plain case, for contrast with the two below it"

[[resolved]]
from = "acme.Dispatch.shout"
to = "acme.normalize"
why = """an extension function's body. The receiver is resolved statically by \
its type, so the call inside it is as plain as any other."""

[[resolved]]
from = "acme.Dispatch.viaExtension"
to = "acme.Dispatch.shout"
why = "an extension function is dispatched by the receiver's static type"

[[resolved]]
from = "acme.Dispatch.viaLambda"
to = "acme.normalize"
why = """the lambda body calls normalize. The bytecode routes it through \
`Function1.invoke` and a synthetic method, but the lambda literal is part of \
viaLambda's own text — which is how Go, Python, TypeScript and Java are read \
here too. Classifying the same shape as ambiguous in one language only would \
measure the key's inconsistency rather than the parser's."""

# ---------------------------------------------------------------------------
# AMBIGUOUS — the declared type gives a shape, not an implementation.
# ---------------------------------------------------------------------------
[[ambiguous]]
from = "acme.Service.load"
site = "store.get(key)"
interface_method = "acme.Store.get"
candidates = ["acme.MemStore.get", "acme.AuditStore.get"]
why = "the property is typed Store; the implementation arrives at construction"

[[ambiguous]]
from = "acme.Service.save"
site = "store.put(...)"
interface_method = "acme.Store.put"
candidates = ["acme.MemStore.put", "acme.AuditStore.put"]
why = "same, through put"

[[ambiguous]]
from = "acme.AuditStore.get"
site = "inner.get(key)"
interface_method = "acme.Store.get"
candidates = ["acme.MemStore.get", "acme.AuditStore.get"]
why = "a decorator holding the interface it decorates"

[[ambiguous]]
from = "acme.AuditStore.put"
site = "inner.put(...)"
interface_method = "acme.Store.put"
candidates = ["acme.MemStore.put", "acme.AuditStore.put"]
why = "same, through put"

[[ambiguous]]
from = "acme.Dispatch.viaFunctionRef"
site = "f(value)"
candidates = ["acme.normalize"]
why = "`::normalize` names the function as a value; the call site is Function1.invoke"

# ---------------------------------------------------------------------------
# IMPACT — "what would a change to this reach?", the question an agent asks
# before it edits anything. Scored as a set, over the calls a parser can
# resolve: every symbol below reaches the subject through `resolved` edges
# only, so no tool is asked to guess through an interface.
#
# This is where an edge error stops being a line in a report. One missing call
# hides a whole subtree of callers; one false call drags in code that was
# never involved. The set is the consequence an agent actually experiences.
# ---------------------------------------------------------------------------
[[impact]]
of = "acme.normalize"
reaches = ["acme.Dispatch.direct", "acme.Dispatch.shout", "acme.Dispatch.viaExtension", "acme.Dispatch.viaLambda", "acme.Service.save"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "acme.AuditStore.note"
reaches = ["acme.AuditStore.get", "acme.AuditStore.put"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "acme.Cache.get"
reaches = ["acme.Service.warm"]
why = "every symbol that reaches it through calls a parser can resolve"

[[impact]]
of = "acme.Dispatch.shout"
reaches = ["acme.Dispatch.viaExtension"]
why = "every symbol that reaches it through calls a parser can resolve"

# ---------------------------------------------------------------------------
# ABSENT — must never be asserted.
# ---------------------------------------------------------------------------
[[absent]]
from = "acme.Service.warm"
to = "acme.Store.get"
why = "warm takes a Cache; Store.get merely shares the name"

[[absent]]
from = "acme.Service.warm"
to = "acme.MemStore.get"
why = "same trap, one implementation further"

[[absent]]
from = "acme.Service.load"
to = "acme.Cache.get"
why = "Cache does not implement Store"

[[absent]]
from = "acme.normalize"
to = "acme.MemStore.put"
why = "normalize touches no store at all"

[[absent]]
from = "acme.Dispatch.direct"
to = "acme.Dispatch.viaLambda"
why = "neither calls the other; both reach normalize"
